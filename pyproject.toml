[project]
name = "otari-fight-night"
version = "0.1.0"
description = "Two teams of local models clean a messy CSV through an Otari gateway. Fight night."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
